<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JanLog — Real-time Log Stream</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%236366f1'/%3E%3Cpath d='M7 16h4l2-6 4 12 2-6h6' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
      <defs>
        <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#6366f1" />
          <stop offset="1" stop-color="#8b5cf6" />
        </linearGradient>
      </defs>
      <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#logo-grad)" />
      <path d="M7 16h4l2-6 4 12 2-6h6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <h1 class="app-title">JanLog</h1>
    <span id="conn-badge" class="conn-badge disconnected">
      <span class="dot"></span>
      <span id="conn-label">Connecting…</span>
    </span>
  </div>

  <div class="topbar-actions">
    <div class="source-switch">
      <button id="source-btn" class="source-btn" type="button" title="Switch log source">
        <span class="source-btn-main">
          <span id="source-name" class="source-name">No source</span>
          <span id="source-size" class="source-size"></span>
        </span>
        <span id="source-unread" class="unread-badge" title="Unread errors — click for jump-list" hidden>0</span>
        <svg class="chevron" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <div id="source-menu" class="source-menu" hidden>
        <div class="source-menu-head">Log Sources</div>
        <div id="source-list" class="source-list"></div>
        <form id="add-path-form" class="add-path-form" hidden>
          <input id="add-path-input" type="text" placeholder="/var/log, ./app.log, logs/**/*.log" autocomplete="off" spellcheck="false" />
          <button type="submit" class="btn btn-small">Add</button>
        </form>
      </div>
    </div>

    <button id="stream-btn" class="btn stream-btn" type="button" title="Stream / pause the live view">
      <svg class="icon-pause" viewBox="0 0 16 16" width="11" height="11" aria-hidden="true">
        <rect x="3" y="2" width="3.4" height="12" rx="1" fill="currentColor" />
        <rect x="9.6" y="2" width="3.4" height="12" rx="1" fill="currentColor" />
      </svg>
      <svg class="icon-play" viewBox="0 0 16 16" width="11" height="11" aria-hidden="true">
        <path d="M4 2l10 6-10 6z" fill="currentColor" />
      </svg>
      <span id="stream-label">Pause</span>
    </button>
    <button id="clear-btn" class="btn" type="button" title="Clear the current view">Clear View</button>
  </div>
</header>

<div class="toolbar">
  <div class="filter-box" id="filter-box">
    <svg class="search-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
      <path d="M7 2a5 5 0 1 0 3.1 8.9L13 14l1-1-3-3.1A5 5 0 0 0 7 2zm0 1.6a3.4 3.4 0 1 1 0 6.8 3.4 3.4 0 0 1 0-6.8z" fill="currentColor" />
    </svg>
    <input id="filter-input" type="text" placeholder="Filter logs by text or /regex/..." autocomplete="off" spellcheck="false" />
    <button id="regex-btn" class="mini-toggle" type="button" title="Toggle regex mode">.*</button>
    <button id="case-btn" class="mini-toggle" type="button" title="Toggle case sensitivity">Aa</button>
  </div>

  <div class="level-pills" id="level-pills">
    <button class="pill active" type="button" data-level="all">All <span class="count">0</span></button>
    <button class="pill lvl-error" type="button" data-level="error">Error <span class="count">0</span></button>
    <button class="pill lvl-warn" type="button" data-level="warn">Warn <span class="count">0</span></button>
    <button class="pill lvl-info" type="button" data-level="info">Info <span class="count">0</span></button>
    <button class="pill lvl-debug" type="button" data-level="debug">Debug <span class="count">0</span></button>
  </div>

  <div class="display-toggles">
    <button id="errors-btn" class="mini-toggle errors-btn" type="button" title="Recent errors jump-list">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
        <path d="M8 1.5L15 14H1L8 1.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
        <path d="M8 6v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        <circle cx="8" cy="12.1" r="0.9" fill="currentColor" />
      </svg>
      <span id="errors-count">0</span>
    </button>
    <button id="wrap-btn" class="mini-toggle" type="button" title="Toggle line wrapping">Wrap</button>
    <button id="scroll-btn" class="mini-toggle active" type="button" title="Toggle auto-scroll">Auto-Scroll ↓</button>
    <button id="download-btn" class="btn" type="button" title="Download the current filtered view">Download</button>
  </div>
</div>

<main id="viewer" class="viewer">
  <div id="lines" class="lines"></div>
  <div id="empty-state" class="empty-state" hidden>
    <div class="empty-icon">›_</div>
    <div>Waiting for log lines…</div>
    <div class="empty-hint">Add a source, or run <code>npm run demo-logs</code> to generate traffic</div>
  </div>
</main>

<button id="jump-latest" class="jump-pill" type="button" hidden>Jump to Latest ↓</button>

<aside id="error-drawer" class="error-drawer" hidden>
  <header class="error-drawer-head">
    <span class="error-drawer-title">Recent Errors</span>
    <span id="error-count" class="error-drawer-count">0</span>
    <button id="error-close" class="icon-btn" type="button" title="Close">✕</button>
  </header>
  <div id="error-list" class="error-list"></div>
</aside>

<div id="toast" class="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
